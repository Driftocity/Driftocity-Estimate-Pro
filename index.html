<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1A1F2E">
  <meta name="description" content="Professional contractor estimates and invoices with ZIP-code regional pricing for all trade types.">

  <!-- PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ContractorPro">
  <meta name="application-name" content="ContractorPro">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">

  <title>ContractorPro — Estimates & Invoices</title>
</head>
<body>
  <!-- App Root -->
  <div id="app">
    <!-- Loading splash -->
    <div class="splash-screen" id="splash">
      <div class="splash-inner">
        <div class="splash-icon">
          <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
            <rect width="64" height="64" rx="16" fill="#FF6B35"/>
            <path d="M14 46V26L32 12L50 26V46H37V34H27V46H14Z" fill="white"/>
            <rect x="25" y="36" width="14" height="12" rx="2" fill="#FF6B35"/>
            <rect x="28" y="20" width="8" height="2" rx="1" fill="#FF6B35" opacity="0.4"/>
          </svg>
        </div>
        <div class="splash-name">ContractorPro</div>
        <div class="splash-sub">Estimates & Invoices</div>
        <div class="splash-loader">
          <div class="splash-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Install Banner (shown when PWA can be installed) -->
  <div id="install-banner" class="install-banner hidden">
    <div class="install-banner-content">
      <div class="install-icon">🏗️</div>
      <div class="install-text">
        <strong>Install ContractorPro</strong>
        <span>Add to home screen for offline access</span>
      </div>
      <button class="install-btn" id="install-btn">Install</button>
      <button class="install-dismiss" id="install-dismiss">✕</button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden"></div>

  <!-- Scripts — order matters -->
  <script src="data/pricing.js"></script>
  <script src="js/app.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.warn('SW failed:', err));
      });
    }

    // PWA Install prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('install-banner');
      const dismissed = localStorage.getItem('install_dismissed');
      if (!dismissed) banner.classList.remove('hidden');
    });

    document.getElementById('install-btn')?.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('install-banner').classList.add('hidden');
    });

    document.getElementById('install-dismiss')?.addEventListener('click', () => {
      document.getElementById('install-banner').classList.add('hidden');
      localStorage.setItem('install_dismissed', '1');
    });

    // Remove splash after app loads
    window.addEventListener('load', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash');
        if (splash && document.querySelector('.app-shell')) {
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 300);
        }
      }, 800);
    });

    // Global toast helper
    window.showToast = function(msg, type = 'success') {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.className = `toast toast-${type}`;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3000);
    };

    // Override alert for better UX on mobile
    window._nativeAlert = window.alert;
    window.alert = function(msg) {
      if (msg.startsWith('✅')) {
        showToast(msg, 'success');
      } else if (msg.startsWith('❌') || msg.startsWith('⚠️')) {
        showToast(msg, 'error');
      } else {
        window._nativeAlert(msg);
      }
    };
  </script>
</body>
</html>
